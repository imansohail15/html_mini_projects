<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>An Image Gallery</title>
</head>

<body>
    <header>
        <h1>Nature Photo Album</h1>
        <p>A visual diary of earth’s quiet whispers and grand landscapes.</p>
    </header>
    <hr>
    <main>
        <figure><img height="200px" src="image1.jpeg" alt="image">
            <figcaption>Alpine Lakes & Mountains: Crystal-clear glacial water reflecting towering snow-capped peaks,
                pine forests, and rocky shorelines (such as Moraine Lake or the Dolomites)</figcaption>
        </figure>
        <figure>
            <img height="200px" src="image2.jpeg" alt="image">
            <figcaption>Waterfalls & Rivers: Cascading water tumbling down mossy rock faces or flowing through narrow,
                mist-filled forested valleys</figcaption>
        </figure>
        <figure>
            <img height="200px" src="image3.jpeg" alt="">
            <figcaption>A large natural landform that rises significantly above its surrounding terrain, typically
                featuring steep slopes, a confined summit area, and a distinct peak</figcaption>
        </figure>
        <figure>
            <img height="200px" src="image4.jpeg" alt="image">
            <figcaption>A residential property built along the shoreline of a lake, serving as a permanent home, a
                weekend retreat, or a short-term rental.</figcaption>
        </figure>
        <figure>
            <img height="200px" src="image5.jpeg" alt="image">
            <figcaption>Rare natural bodies of water that get their vibrant color from a combination of high salinity,
                specific microorganisms, or unique mineral deposits</figcaption>
        </figure>
    </main>
    <footer>
        <p>&copy; 2026 Eman. All rights reserved.</p>
    </footer>
</body>

</html>
