<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
</head>
<body>
    <header>
        <h1>Event Registration Form</h1>
        <p>Please fill out the form below to register for our upcoming event</p>
    </header>
    <main>
        <form action="submit">
            <label for="name">Enter your name:</label>
            <input type="text" placeholder="name"><br><br>
            <label for="email">Enter your email: </label>
            <input type="text" placeholder="email"><br><br>
            <label for="number">Enter your phone no.:</label>
            <input type="number" placeholder="phone No."><br><br>
            <label >Gender:</label><br>
            <input type="radio" id="male" name="gender" value="male">
            <label for="male">Male</label>
            <input type="radio" id="female" name="gender" value="female">
            <label for="female">Female</label><br><br>
            <label>Select your interests:</label><br>
            <input type="checkbox" id="coding" name="interest" value="coding">
            <label for="coding">Coding</label><br>
            <input type="checkbox" id="design" name="interest" value="design">
            <label for="design">Design</label><br><br>
            <label for="city">Select city:</label><br>
            <select name="city" id="city">
                <option value="karachi">Karachi</option>
                <option value="Lahore">Lahore</option>
                <option value="Islamabad">Islamabad</option>
            </select><br><br>
            <label for="feedback">Your Feedback:</label><br>
            <textarea name="feedback" id="feedback" rows="4" cols="30"></textarea><br><br>
            <button type="submit">Submit Registration</button>

        </form>
    </main>
    <footer>
        <p>&copy; 2026 Eman. All rights reserved.</p>
    </footer>
</body>
</html>
